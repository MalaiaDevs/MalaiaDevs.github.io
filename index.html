<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="robots" content="noindex">
<title>Pedidos · Importaciones London</title>
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#172033;--muted:#5d6a7e;--line:#e1e6ee;--brand:#1f3a5f;--brand-ink:#fff;
  --accent:#0b8f6a;--accent-ink:#fff;--warn:#a96a00;--warn-bg:#fff4dc;--danger:#c0392b;--danger-bg:#fdecea;
  --ok-bg:#e3f6ee;--sh:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);--r:14px;
  --c-nuevo:#2563eb;--c-dropi:#7c3aed;--c-avisar:#c27a00;--c-camino:#0e8aa0;--c-entregado:#0b8f6a;--c-devuelto:#c0392b;--c-cancelado:#6b7280;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1420;--card:#161f2f;--ink:#e8edf5;--muted:#9aa7bc;--line:#26324a;--brand:#0b1220;--brand-ink:#e8edf5;
  --accent:#27b88c;--accent-ink:#04261c;--warn:#f0b24a;--warn-bg:#3a2d12;--danger:#ff7a6b;--danger-bg:#3b1a18;--ok-bg:#12352b;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --c-nuevo:#6b9bff;--c-dropi:#b196ff;--c-avisar:#f0b24a;--c-camino:#4cc6dc;--c-entregado:#27b88c;--c-devuelto:#ff7a6b;--c-cancelado:#9aa3b2}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{font-weight:700;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:inherit}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.iconbtn svg{width:20px;height:20px}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tabs{position:sticky;top:60px;z-index:19;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--muted);display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab .n{background:var(--line);color:var(--ink);border-radius:999px;padding:0 7px;font-size:12px;min-width:20px;text-align:center}
.tab[aria-selected=true] .n{background:rgba(255,255,255,.25);color:inherit}
.tab .n.hot{background:var(--danger);color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px;padding-bottom:96px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.order{padding:13px 14px;text-align:left;width:100%;display:block;border-left:5px solid var(--sc,var(--line))}
.order:hover{border-color:var(--sc,var(--brand))}
.order .r1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.order .nm{font-weight:700;font-size:16px;margin:3px 0 1px;overflow-wrap:anywhere}
.order .mt{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--accent);border-color:transparent}
.badge{white-space:nowrap;display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff;background:var(--sc,var(--muted))}
.s-nuevo{--sc:var(--c-nuevo)}.s-dropi{--sc:var(--c-dropi)}.s-avisar{--sc:var(--c-avisar)}.s-camino{--sc:var(--c-camino)}
.s-entregado{--sc:var(--c-entregado)}.s-devuelto{--sc:var(--c-devuelto)}.s-cancelado{--sc:var(--c-cancelado)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-height:42px}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c-nuevo);outline-offset:1px}
.search{max-width:380px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 10px}
label.f>span{display:block;margin-bottom:4px}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}.row2.keep{grid-template-columns:1fr 1fr}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:wait}
.btn svg{width:18px;height:18px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btns .btn{flex:1 1 auto}
.locked .tabs,.locked #fab,.locked #btnRefresh{display:none}
.login{max-width:420px;margin:8vh auto 0}
.fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:15;border-radius:999px;padding:0 20px;height:52px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{padding:12px 14px;text-align:left}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.pipe{border-left:5px solid var(--sc);cursor:pointer;background:var(--card)}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);margin-bottom:8px;font-weight:600;border:0;width:100%;text-align:left}
.alert.bad{background:var(--danger-bg);color:var(--danger)}
.alert.ok{background:var(--ok-bg);color:var(--accent)}
/* dropzone */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--c-nuevo);background:var(--bg)}
.drop b{display:block;font-size:16px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative}
.thumbs img{height:84px;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--danger);color:#fff;line-height:1}
.form{padding:16px}
.miss{border-color:var(--warn)!important;background:var(--warn-bg)!important}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.hint.warn{color:var(--warn)}
/* modal */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;overflow:hidden}
dialog::backdrop{background:rgba(8,12,20,.55)}
.sheet{background:var(--bg);color:var(--ink);width:min(680px,100%);max-height:100dvh;height:100dvh;margin-left:auto;display:flex;flex-direction:column}
@media (min-width:760px){dialog[open]{display:grid;place-items:center}.sheet{height:auto;max-height:92dvh;border-radius:18px;margin:0;box-shadow:0 20px 60px rgba(0,0,0,.4)}}
.sheet header{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);padding-top:max(14px,env(safe-area-inset-top))}
.sheet header .t{flex:1;min-width:0}
.sheet header .t b{font-size:17px;display:block;overflow-wrap:anywhere}
.sheet header .t>span{font-size:13px;color:var(--muted)}
.sheet .body{padding:14px 16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.x{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:20px;line-height:1}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.sec h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.copyrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px;min-height:46px}
.copyrow:hover{border-color:var(--c-nuevo)}
.copyrow .lbl{flex:0 0 96px;font-size:12px;color:var(--muted);font-weight:600}
.copyrow .val{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.copyrow .val.none{color:var(--muted);font-weight:400}
.copyrow svg{width:18px;height:18px;color:var(--muted);flex:none}
.copyrow.copied{background:var(--ok-bg);border-color:var(--accent)}
.copyrow.copied svg{color:var(--accent)}
.copyrow.small{min-height:38px;padding:6px 11px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
.pos{color:var(--accent);font-weight:700}.neg{color:var(--danger);font-weight:700}
.msg{width:100%;min-height:230px;font-size:14.5px;line-height:1.5}
.note{font-size:13px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;margin:8px 0}
details>summary{cursor:pointer;font-weight:600;padding:4px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:max(84px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#10182a;color:#fff;border-radius:12px;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#b3261e}
.demo{background:var(--warn-bg);color:var(--warn);padding:7px 16px;font-size:13px;text-align:center;font-weight:600}
.camcard{padding:14px}
.camcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.progress{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent)}
.steps{counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
@media print{.topbar,.tabs,.fab{display:none}}
</style>
</head>
<body>
<div id="demoBar" class="demo" hidden>Modo demostración: estos datos son de ejemplo y no se guardan en tu Excel. Conecta tu hoja en ⚙ Configuración.</div>
<div class="topbar">
  <div class="brand">Importaciones London<small id="sync">Sin conectar</small></div>
  <button class="iconbtn" id="btnRefresh" title="Actualizar" aria-label="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  <button class="iconbtn" id="btnSettings" title="Configuración" aria-label="Configuración"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
<main id="main"></main>
<button class="btn primary fab" id="fab" aria-label="Nuevo pedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo pedido</button>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec).
   No es un secreto: sin la contraseña no entrega nada. La contraseña NO está en este archivo:
   se valida en tu Apps Script y se cambia en ⚙ Configuración.
   ===================================================================== */
const PRESET = { url: '' };

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const num = v => { if (v === '' || v == null) return 0; const n = Number(String(v).replace(/[^\d.-]/g, '')); return isFinite(n) ? n : 0; };
const money = n => (n === '' || n == null || isNaN(n)) ? '—' : new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0}).format(n).replace(/\s/g, '');
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const todayStr = () => new Intl.DateTimeFormat('en-CA', {timeZone:'America/Bogota'}).format(new Date());
const fmtDate = d => { if (!d) return ''; const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(d); };
const daysSince = d => { const m = String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return null; return Math.floor((Date.parse(todayStr()) - Date.parse(`${m[1]}-${m[2]}-${m[3]}`)) / 864e5); };
const ago = d => { const n = daysSince(d); return n == null ? '' : n <= 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} d`; };
const idStr = v => v === '' || v == null ? '' : (typeof v === 'number' ? String(Math.round(v)) : String(v));
const firstName = n => { const t = String(n||'').trim().split(/\s+/); return t[0] ? t[0][0].toUpperCase() + t[0].slice(1).toLowerCase() : ''; };
const ICON = {
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.7-5.1A8.5 8.5 0 1 1 21 12z"/></svg>'
};

/* ---------- estado global ---------- */
const S = {
  cfg: { url: PRESET.url || store.get('pl_url') || '', token: store.get('pl_dev') || '' }, loginMsg: '',
  demo: false, data: null, view: 'resumen', filter: 'todos', q: '', modalId: null, edit: false, loading: false, last: null, ai: null,
  imgs: [], err: ''
};
const DEFAULT_TPL = `Hola {nombre}, tu pedido de {producto} ya salió 🚚

Transportadora: {transportadora}
Número de guía: {guia}

Te adjunto la guía en PDF. Llega {tiempo} y pagas {valor} al recibir, así que ten el valor a la mano.

Si necesitas algo, me escribes por aquí.`;
const getTpl = () => store.get('pl_tpl') || DEFAULT_TPL;

const STAGES = {
  nuevo:{label:'Por realizar', hint:'Pedidos nuevos: créalos en Dropi'},
  dropi:{label:'Esperando guía', hint:'Ya están en Dropi y falta la guía'},
  avisar:{label:'Avisar guía', hint:'Despachados: falta enviarle la guía al cliente'},
  camino:{label:'En camino', hint:'El cliente ya tiene su guía'},
  entregado:{label:'Entregado'}, devuelto:{label:'Devuelto'}, cancelado:{label:'Cancelado'}
};
function stage(p){
  const e = String(p.estado || '').trim();
  if (e === 'Entregado') return 'entregado';
  if (e === 'Devuelto') return 'devuelto';
  if (e === 'Cancelado') return 'cancelado';
  const hasGuia = !!idStr(p.guia);
  if (e === 'Despachado' || (e === 'Confirmado' && hasGuia)) return p.guiaEnv === true ? 'camino' : 'avisar';
  if (e === 'Confirmado') return 'dropi';
  return 'nuevo';
}
const P_ = () => (S.data ? S.data.pedidos : []);
const byStage = st => P_().filter(p => stage(p) === st);
const findProd = name => S.data && S.data.productos.find(x => norm(x.nombre) === norm(name));
const findCam = id => S.data && S.data.campanas.find(c => c.id === id);
const prodLabel = p => String(p || '').trim();

/* ---------- API ---------- */
function diagnose(txt, status){
  const t = String(txt || '');
  if (/accounts\.google\.com|ServiceLogin|Iniciar sesi[oó]n|Sign in/i.test(t)) return 'Google está pidiendo iniciar sesión. En Apps Script: Implementar › Administrar implementaciones › ✏ Editar, deja “Ejecutar como: Yo” y “Quién tiene acceso: Cualquier persona” (no “con cuenta de Google”), y guarda como Nueva versión.';
  if (/doPost/i.test(t)) return 'Tu Apps Script no tiene la función doPost. Pega el Code.gs completo, guarda y crea una Nueva versión de la implementación.';
  if (/Se necesita autorizaci|Authorization required|authorize/i.test(t)) return 'Falta autorizar el script. En el editor de Apps Script ejecuta (▶) cualquier función, acepta los permisos y vuelve a implementar.';
  if (/No se pudo abrir|unable to open|Page Not Found|404|no se encontr/i.test(t)) return 'La URL no es de una implementación activa. Copia otra vez la “URL de la aplicación web” (termina en /exec).';
  const plain = t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 110);
  return `La hoja no respondió como se esperaba (HTTP ${status}). Revisa que la URL termine en /exec y que el acceso sea “Cualquier persona”.${plain ? ' Respuesta: “' + plain + '”' : ''}`;
}
function cleanUrl(u){
  const m = String(u || '').replace(/\s+/g, '').match(/https:\/\/script\.google\.com\/(?:a\/macros\/[^\/]+\/)?macros\/s\/[\w-]+\/exec/);
  return m ? m[0] : '';
}
async function testConn(url, el){
  el.style.color = ''; el.textContent = 'Probando…';
  try {
    const r = await fetch(url), t = await r.text(); let j; try { j = JSON.parse(t); } catch (e) { throw new Error(diagnose(t, r.status)); }
    if (j && j.ok && j.version >= 3) { el.style.color = 'var(--accent)'; el.textContent = 'Conexión correcta.'; }
    else if (j && j.ok) { el.style.color = 'var(--danger)'; el.textContent = 'La URL responde, pero con una versión vieja del código. En Apps Script: Implementar › Administrar implementaciones › ✏ › Versión: Nueva versión › Implementar.'; }
    else throw new Error('Respuesta inesperada.');
  } catch (e) { el.style.color = 'var(--danger)'; el.textContent = /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'No se pudo conectar. Revisa internet y que la URL esté completa.' : e.message; }
}
async function api(action, payload = {}) {
  if (S.demo) return Demo.call(action, payload);
  if (!S.cfg.url) throw new Error('Falta la URL de la hoja');
  let r, txt;
  try {
    r = await fetch(S.cfg.url, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({ token: S.cfg.token || undefined, action, ...payload }) });
    txt = await r.text();
  } catch (e) { throw new Error('No hay conexión con tu hoja. Revisa tu internet y que la URL esté completa.'); }
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error(diagnose(txt, r.status)); }
  if (!j.ok) {
    if (j.code === 'AUTH' && action !== 'login') { logout(true, j.error); throw new Error(j.error); }
    throw new Error(j.error || 'Error desconocido');
  }
  return j;
}

/* ---------- cálculos de dinero ---------- */
function econ(p){
  const prod = findProd(p.producto), cant = num(p.cant) || 1;
  const otros = (S.data && S.data.otros) || 0;
  const venta = num(p.venta) || (prod ? num(prod.precio) * cant : 0);
  const costoU = num(p.costo) || (prod ? num(prod.costo) : 0);
  const envio = num(p.envio) || (prod ? num(prod.fleteUsado || prod.fleteEst) : 0);
  const costo = (costoU + otros) * cant;
  return { venta, costoU, envio, costo, entregado: venta - costo - envio, devuelto: -envio, estimado: !num(p.costo) || !num(p.envio) || !num(p.venta) };
}

}

document.addEventListener('click', async e => {
  const t = e.target;
  const tab = t.closest('[data-tab]'); if (tab) { const f = tab.dataset.filterSet; return go(tab.dataset.tab, f); }
  const fl = t.closest('[data-filter]'); if (fl) { S.filter = fl.dataset.filter; return renderAll(); }
  const op = t.closest('[data-open]'); if (op) return openOrder(op.dataset.open);
  const rm = t.closest('[data-rm]'); if (rm) { S.imgs.splice(Number(rm.dataset.rm), 1); return renderThumbs(); }
  const cp = t.closest('[data-copy]'); if (cp) { const ok = await copyText(cp.dataset.copy); if (cp.classList.contains('copyrow')) { cp.classList.add('copied'); const old = cp.querySelector('svg'); old.outerHTML = ICON.check; setTimeout(() => { cp.classList.remove('copied'); const s = cp.querySelector('svg'); if (s) s.outerHTML = ICON.copy; }, 1400); } return toast(ok ? 'Copiado' : 'No pude copiar. Mantén presionado para copiar a mano.', !ok); }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, p = S.modalId ? getP(S.modalId) : null;
  if (act === 'close') return closeModal();
  if (act === 'settings') return openSettings();
  if (act === 'logout') return busy(a, async () => { try { await api('logout'); } catch (e) {} logout(); });
  if (act === 'retry') { S.err = ''; renderAll(); return load(); }
  if (act === 'demo') return startDemo();
  if (act === 'read') return readImages(a);
  if (act === 'clearImgs') { S.imgs = []; return renderThumbs(); }
  if (act === 'sample') return applyFields({ ...SAMPLE });
  if (act === 'saveNew') return saveNew(a);
  if (act === 'addSpend') return busy(a, async () => {
    const c = $('#sp_c').value, g = num($('#sp_g').value); if (!c || !g) return toast('Elige la campaña y escribe el gasto', true);
    await api('addSpend', { spend: { campana: c, fecha: $('#sp_d').value, gasto: g } }); $('#sp_g').value = ''; toast('Gasto guardado'); await load(true, true);
  });
  if (!p) return;
  const v = formVals();
  if (act === 'toggleEdit') { S.edit = !S.edit; return refreshModal(); }
  if (act === 'cancelEdit') { S.edit = false; return refreshModal(); }
  if (act === 'saveEdit') return busy(a, async () => { S.edit = false; await patch(p.id, v, 'Cambios guardados'); });
  if (act === 'cancelOrder') { if (!confirm('¿Cancelar el pedido ' + p.id + '?')) return; return busy(a, () => patch(p.id, { estado: 'Cancelado' }, 'Pedido cancelado')); }
  if (act === 'toDropi') {
    if (!v.dropi) return toast('Escribe el ID de Dropi', true);
    if (!v.transp) return toast('Elige la transportadora', true);
    if (!num(v.envio)) return toast('Escribe el precio del envío', true);
    return busy(a, () => patch(p.id, { dropi: v.dropi, transp: v.transp, costo: v.costo, envio: v.envio, estado: 'Confirmado' }, 'Creado en Dropi. Ahora espera la guía.'));
  }
  if (act === 'saveGuia') {
    const g = v.guia; if (!g) return toast('Escribe el número de guía', true);
    const pt = { guia: g, transp: v.transp || p.transp };
    if (v.costo !== undefined) pt.costo = v.costo; if (v.envio !== undefined) pt.envio = v.envio;
    if (stage(p) === 'dropi' || String(p.estado).trim() !== 'Despachado') { pt.estado = 'Despachado'; pt.fDespacho = todayStr(); pt.guiaEnv = false; }
    return busy(a, () => patch(p.id, pt, 'Guía guardada. Falta avisarle al cliente.'));
  }
  if (act === 'copyMsg') { const ok = await copyText($('#msgTxt').value); return toast(ok ? 'Mensaje copiado. Adjunta el PDF al enviarlo.' : 'No pude copiar', !ok); }
  if (act === 'openWA') { const url = waLink(p, $('#msgTxt').value); window.open(url, '_blank', 'noopener'); return; }
  if (act === 'guideSent') return busy(a, () => patch(p.id, { guiaEnv: true, fAviso: todayStr() }, 'Marcado: guía enviada al cliente'));
  if (act === 'entregado') return busy(a, () => patch(p.id, { estado: 'Entregado', fEntrega: v.fEntrega || todayStr() }, 'Pedido entregado'));
  if (act === 'devuelto') { if (!confirm('¿Marcar ' + p.id + ' como devuelto? Se descuenta solo el envío (' + money(econ(p).envio) + ').')) return; return busy(a, () => patch(p.id, { estado: 'Devuelto', fEntrega: v.fEntrega || todayStr() }, 'Pedido devuelto')); }
  if (act === 'reopen') return busy(a, () => patch(p.id, { estado: 'Despachado', fEntrega: '' }, 'Volvió a “En camino”'));
});
